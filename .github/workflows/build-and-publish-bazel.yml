name: Build and publish Bazel

on:
  push:
    branches:
      - 'release-[0-9]+.0.0-pre.[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].[0-9]+rc1'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional exact branch tag (for release-10.0.0-pre.20261021.1rc1, use 10.0.0-pre.20261021.1)
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: bazel-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Select release tag
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
    steps:
      - name: Check out Bazel
        uses: actions/checkout@v4

      - name: Test immutable release publication
        run: bash .github/scripts/publish-bazel-release-test.sh

      - name: Test Windows executable verification
        run: python3 -B .github/scripts/verify-windows-bazel-test.py

      - name: Select release tag
        id: release_tag
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash .github/scripts/bazel-release-tag.sh select

  validate:
    name: Validate release regressions
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - name: Check out Bazel
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Bazelisk
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(id -u)" -ne 0
          df -h . /tmp
          free -h
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            --output "${RUNNER_TEMP}/bazelisk" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          chmod +x "${RUNNER_TEMP}/bazelisk"

      - name: Test module, toolchain, server, repository cache, query, and Skycache regressions
        run: |
          set -euo pipefail
          if [[ -z "${BUILDBUDDY_API_KEY}" ]]; then
            echo 'Missing the BUILDBUDDY_API_KEY Actions secret.' >&2
            exit 1
          fi
          targets=(
            //src/test/java/com/google/devtools/build/lib/bazel/bzlmod:BzlmodTests
            //src/test/java/com/google/devtools/build/lib/bazel/repository/starlark:StarlarkTests
            //src/test/java/com/google/devtools/build/lib/buildtool:GenAqueryIntegrationTest
            //src/test/java/com/google/devtools/build/lib/buildtool:GenCqueryIntegrationTest
            //src/test/java/com/google/devtools/build/lib/exec:ExecTests
            //src/test/java/com/google/devtools/build/lib/skyframe:FileFunctionTest
            //src/test/java/com/google/devtools/build/lib/skyframe/serialization/analysis:BazelSkycacheIntegrationTest
            //src/test/java/com/google/devtools/build/lib/skyframe/toolchains:RegisteredToolchainsFunctionTest
            //src/test/java/com/google/devtools/build/lib/skyframe/toolchains:SingleToolchainResolutionFunctionTest
            //src/test/java/com/google/devtools/build/lib/skyframe/toolchains:ToolchainResolutionFunctionTest
            //src/test/java/com/google/devtools/build/lib/server:ServerTests
            //src/test/java/com/google/devtools/build/lib/remote:RemoteTests
            //src/test/java/com/google/devtools/build/lib/remote/disk:disk
            //src/test/py/bazel:bazel_lockfile_test
            //src/test/py/bazel:remote_repo_contents_cache_test
            //src/test/py/bazel:remote_repo_contents_cache_rewinding_test
          )
          printf 'Source: `%s`\n\n' "${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- `%s`\n' "${targets[@]}" >> "${GITHUB_STEP_SUMMARY}"
          "${RUNNER_TEMP}/bazelisk" \
            --batch --nohome_rc --nosystem_rc --host_jvm_args=-Xmx4g \
            test --config=buildbuddy-cache \
            "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}" \
            --jobs=2 --local_test_jobs=1 \
            --local_resources=cpu=2 --local_resources=memory=8192 \
            --worker_max_instances=1 \
            --nocache_test_results --test_timeout=1800 --keep_going \
            --test_output=errors --test_summary=detailed --verbose_failures \
            --color=no --curses=no "${targets[@]}"

      - name: Upload validation test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ needs.prepare.outputs.release_tag }}
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build ${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    container:
      image: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            container: oraclelinux:8
            bazelisk_os: linux
            bazelisk_arch: amd64
            artifact_os: linux
            artifact_arch: x86_64
          - runner: ubuntu-24.04-arm
            container: oraclelinux:8
            bazelisk_os: linux
            bazelisk_arch: arm64
            artifact_os: linux
            artifact_arch: arm64
          - runner: macos-15-intel
            bazelisk_os: darwin
            bazelisk_arch: amd64
            artifact_os: darwin
            artifact_arch: x86_64
          - runner: macos-15
            bazelisk_os: darwin
            bazelisk_arch: arm64
            artifact_os: darwin
            artifact_arch: arm64
          - runner: windows-2022
            bazelisk_os: windows
            bazelisk_arch: amd64
            artifact_os: windows
            artifact_arch: x86_64
          - runner: windows-2022
            bazelisk_os: windows
            bazelisk_arch: amd64
            artifact_os: windows
            artifact_arch: arm64
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
    steps:
      - name: Set up Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --system core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bash = 'C:/msys64/usr/bin/bash.exe'
          & $bash -lc 'pacman --noconfirm --needed -S zip unzip patch'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Visual Studio x64 and ARM64 tools are required.' }
          "BAZEL_VC=$vs/VC" >> $env:GITHUB_ENV
          "BAZEL_SH=$bash" >> $env:GITHUB_ENV
          'C:/msys64/usr/bin' >> $env:GITHUB_PATH

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          dnf install -y \
            curl \
            gcc-c++ \
            git \
            java-21-openjdk \
            python3 \
            unzip \
            which \
            zip

      - name: Check out Bazel
        uses: actions/checkout@v4

      - name: Install Bazelisk
        env:
          BAZELISK_OS: ${{ matrix.bazelisk_os }}
          BAZELISK_ARCH: ${{ matrix.bazelisk_arch }}
        run: |
          set -euo pipefail
          suffix=''
          if [[ "${BAZELISK_OS}" == windows ]]; then suffix=.exe; fi
          curl --fail --location --retry 3 \
            --output "bazelisk${suffix}" \
            "https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-${BAZELISK_OS}-${BAZELISK_ARCH}${suffix}"
          chmod +x "bazelisk${suffix}"

      - name: Build Bazel
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          if [[ -z "${BUILDBUDDY_API_KEY}" ]]; then
            echo 'Missing the BUILDBUDDY_API_KEY Actions secret.' >&2
            exit 1
          fi
          ./bazelisk --batch --nohome_rc --nosystem_rc build \
            --config=buildbuddy-cache \
            "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}" \
            --verbose_failures \
            --compilation_mode=opt \
            --jobs=2 \
            --stamp \
            "--embed_label=${RELEASE_TAG}" \
            //src:bazel

      - name: Build Windows Bazel
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:BUILDBUDDY_API_KEY) { throw 'Missing the BUILDBUDDY_API_KEY Actions secret.' }
          $config = @()
          if ($env:ARTIFACT_ARCH -eq 'arm64') { $config += '--config=windows_arm64' }
          ./bazelisk.exe --output_user_root=C:/b --batch --nohome_rc --nosystem_rc build `
            --config=buildbuddy-cache `
            --remote_download_all `
            "--remote_header=x-buildbuddy-api-key=$env:BUILDBUDDY_API_KEY" `
            --verbose_failures --compilation_mode=opt --jobs=2 --stamp `
            "--embed_label=$env:RELEASE_TAG" @config //src:bazel.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify and package Bazel
        if: runner.os != 'Windows'
        env:
          ARTIFACT_OS: ${{ matrix.artifact_os }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
        run: |
          set -euo pipefail
          asset_name="bazel-${RELEASE_TAG}-${ARTIFACT_OS}-${ARTIFACT_ARCH}"
          mkdir -p artifacts
          cp bazel-bin/src/bazel "artifacts/${asset_name}"
          chmod +x "artifacts/${asset_name}"
          "artifacts/${asset_name}" --batch --ignore_all_rc_files version | tee bazel-version.txt
          grep -Fq "Build label: ${RELEASE_TAG}" bazel-version.txt
          if command -v sha256sum > /dev/null; then
            (cd artifacts && sha256sum "${asset_name}" > "${asset_name}.sha256")
          else
            (cd artifacts && shasum -a 256 "${asset_name}" > "${asset_name}.sha256")
          fi

      - name: Verify bazel_features with the stamped Bazel binary
        if: matrix.artifact_os == 'linux' && matrix.artifact_arch == 'x86_64'
        run: |
          set -euo pipefail
          binary="${GITHUB_WORKSPACE}/artifacts/bazel-${RELEASE_TAG}-linux-x86_64"
          smoke="$(mktemp -d)"
          trap 'rm -rf "${smoke}"' EXIT
          mkdir "${smoke}/workspace"
          cat > "${smoke}/workspace/MODULE.bazel" <<'EOF'
          module(name = "bazel_features_release_test")
          bazel_dep(name = "bazel_features", version = "1.50.0")
          EOF
          cat > "${smoke}/workspace/check.bzl" <<'EOF'
          load("@bazel_features//:features.bzl", "bazel_features")

          def check(name):
              if not bazel_features.cc.supports_path_variable_patterns:
                  fail("bazel_features must recognize Bazel 10.0.0-pre.20260408.3 features")
              native.filegroup(name = name)
          EOF
          cat > "${smoke}/workspace/BUILD.bazel" <<'EOF'
          load(":check.bzl", "check")
          check(name = "features")
          EOF
          cd "${smoke}/workspace"
          "${binary}" --batch --output_base="${smoke}/output" --ignore_all_rc_files \
            query //:features --color=no --curses=no

      - name: Verify and package Windows Bazel
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = "bazel-$env:RELEASE_TAG-windows-$env:ARTIFACT_ARCH.exe"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item bazel-bin/src/bazel.exe "artifacts/$asset"
          python .github/scripts/verify-windows-bazel.py "artifacts/$asset" $env:ARTIFACT_ARCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:ARTIFACT_ARCH -eq 'x86_64') {
            $version = & "./artifacts/$asset" --output_user_root=C:/v --batch --ignore_all_rc_files version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $version
            if ($version -notcontains "Build label: $env:RELEASE_TAG") { throw 'Incorrect Bazel release label.' }
          }
          $hash = (Get-FileHash "artifacts/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$pwd/artifacts/$asset.sha256", "$hash  $asset`n")

      - name: Upload Bazel artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazel-${{ needs.prepare.outputs.release_tag }}-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  verify-windows-arm64:
    name: Run Windows ARM64 Bazel
    needs:
      - prepare
      - build
    runs-on: windows-11-arm
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Check out Bazel
        uses: actions/checkout@v4

      - name: Download Windows ARM64 Bazel
        uses: actions/download-artifact@v4
        with:
          name: bazel-${{ needs.prepare.outputs.release_tag }}-windows-arm64
          path: artifacts

      - name: Verify Windows ARM64 Bazel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ARCH -ne 'ARM64') { throw 'An ARM64 runner is required.' }
          $asset = "bazel-$env:RELEASE_TAG-windows-arm64.exe"
          $hash = (Get-FileHash "artifacts/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content "artifacts/$asset.sha256") -ne "$hash  $asset") { throw 'Incorrect SHA256 checksum.' }
          python .github/scripts/verify-windows-bazel.py "artifacts/$asset" arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = & "./artifacts/$asset" --output_user_root=C:/v --batch --ignore_all_rc_files version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version
          if ($version -notcontains "Build label: $env:RELEASE_TAG") { throw 'Incorrect Bazel release label.' }

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - build
      - verify-windows-arm64
      - validate
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Check out Bazel
        uses: actions/checkout@v4

      - name: Download Bazel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bazel-*
          path: artifacts
          merge-multiple: true

      - name: Verify Bazel artifacts
        run: |
          set -euo pipefail
          for artifact_os in linux darwin windows; do
            for artifact_arch in x86_64 arm64; do
              asset_name="bazel-${RELEASE_TAG}-${artifact_os}-${artifact_arch}"
              if [[ "${artifact_os}" == windows ]]; then asset_name+=.exe; fi
              test -f "artifacts/${asset_name}"
              test -f "artifacts/${asset_name}.sha256"
              (cd artifacts && sha256sum --check "${asset_name}.sha256")
            done
          done

      - name: Attest Bazel artifacts
        id: attest_bazel
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            artifacts/bazel-${{ needs.prepare.outputs.release_tag }}-linux-x86_64
            artifacts/bazel-${{ needs.prepare.outputs.release_tag }}-linux-arm64
            artifacts/bazel-${{ needs.prepare.outputs.release_tag }}-darwin-x86_64
            artifacts/bazel-${{ needs.prepare.outputs.release_tag }}-darwin-arm64
            artifacts/bazel-${{ needs.prepare.outputs.release_tag }}-windows-x86_64.exe
            artifacts/bazel-${{ needs.prepare.outputs.release_tag }}-windows-arm64.exe

      - name: Write Bazel artifact attestations
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest_bazel.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "${ATTESTATION_BUNDLE}"
          for artifact_os in linux darwin windows; do
            for artifact_arch in x86_64 arm64; do
              asset_name="bazel-${RELEASE_TAG}-${artifact_os}-${artifact_arch}"
              if [[ "${artifact_os}" == windows ]]; then asset_name+=.exe; fi
              jq --compact-output . "${ATTESTATION_BUNDLE}" \
                > "artifacts/${asset_name}.intoto.jsonl"
              test -s "artifacts/${asset_name}.intoto.jsonl"
            done
          done

      - name: Publish immutable GitHub release
        run: bash .github/scripts/publish-bazel-release.sh artifacts
