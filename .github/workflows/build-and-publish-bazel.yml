name: Build and publish Bazel 9.3

on:
  push:
    branches:
      - 9.3.0-actiond-dzbarsky14
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (9.3.0-actiond-dzbarsky14)
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Select release tag
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
    steps:
      - name: Select release tag
        id: release_tag
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_tag="${INPUT_RELEASE_TAG:-${GITHUB_REF_NAME}}"
          if [[ ! "${release_tag}" =~ ^9\.3\.0-actiond-dzbarsky14$ ]]; then
            echo "Invalid actiond release tag: ${release_tag}" >&2
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    container:
      image: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            container: oraclelinux:8
            bazelisk_os: linux
            bazelisk_arch: amd64
            artifact_os: linux
            artifact_arch: x86_64
          - runner: ubuntu-24.04-arm
            container: oraclelinux:8
            bazelisk_os: linux
            bazelisk_arch: arm64
            artifact_os: linux
            artifact_arch: arm64
          - runner: macos-15-intel
            bazelisk_os: darwin
            bazelisk_arch: amd64
            artifact_os: darwin
            artifact_arch: x86_64
          - runner: macos-15
            bazelisk_os: darwin
            bazelisk_arch: arm64
            artifact_os: darwin
            artifact_arch: arm64
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          dnf install -y \
            curl \
            gcc-c++ \
            git \
            java-21-openjdk \
            python3 \
            unzip \
            which \
            zip

      - name: Check out Bazel
        uses: actions/checkout@v4

      - name: Install Bazelisk
        env:
          BAZELISK_OS: ${{ matrix.bazelisk_os }}
          BAZELISK_ARCH: ${{ matrix.bazelisk_arch }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output bazelisk \
            "https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-${BAZELISK_OS}-${BAZELISK_ARCH}"
          chmod +x bazelisk

      - name: Build Bazel
        run: |
          set -euo pipefail
          if [[ -z "${BUILDBUDDY_API_KEY}" ]]; then
            echo 'Missing the BUILDBUDDY_API_KEY Actions secret.' >&2
            exit 1
          fi
          ./bazelisk --batch --nohome_rc --nosystem_rc build \
            --config=buildbuddy-cache \
            "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}" \
            --verbose_failures \
            --compilation_mode=opt \
            --jobs=2 \
            --stamp \
            "--embed_label=${RELEASE_TAG}" \
            //src:bazel

      - name: Verify and package Bazel
        env:
          ARTIFACT_OS: ${{ matrix.artifact_os }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
        run: |
          set -euo pipefail
          asset_name="bazel-${RELEASE_TAG}-${ARTIFACT_OS}-${ARTIFACT_ARCH}"
          mkdir -p artifacts
          cp bazel-bin/src/bazel "artifacts/${asset_name}"
          chmod +x "artifacts/${asset_name}"
          "artifacts/${asset_name}" --batch --ignore_all_rc_files version | tee bazel-version.txt
          grep -Fq "Build label: ${RELEASE_TAG}" bazel-version.txt
          if command -v sha256sum > /dev/null; then
            (cd artifacts && sha256sum "${asset_name}" > "${asset_name}.sha256")
          else
            (cd artifacts && shasum -a 256 "${asset_name}" > "${asset_name}.sha256")
          fi

      - name: Verify packaged Bazel executes tests with its native wrapper
        env:
          ARTIFACT_OS: ${{ matrix.artifact_os }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
        run: |
          set -euo pipefail
          unset BUILDBUDDY_API_KEY

          asset_path="${GITHUB_WORKSPACE}/artifacts/bazel-${RELEASE_TAG}-${ARTIFACT_OS}-${ARTIFACT_ARCH}"
          smoke_root="$(mktemp -d "${RUNNER_TEMP}/bazel-actiond-smoke.XXXXXXXX")"
          smoke_workspace="${smoke_root}/workspace"
          mkdir -p "${smoke_workspace}"
          touch "${smoke_workspace}/MODULE.bazel"
          cp "${GITHUB_WORKSPACE}/src/test/tools/bzlmod/MODULE.bazel.lock" \
            "${smoke_workspace}/MODULE.bazel.lock"

          cat > "${smoke_workspace}/smoke.bzl" <<'STARLARK'
          def _smoke_impl(ctx):
              executable = ctx.actions.declare_file(ctx.label.name)
              ctx.actions.write(
                  output = executable,
                  content = "#!/bin/sh\nset -eu\ntest \"${BAZEL_TEST:-}\" = 1\necho native-wrapper-smoke-ok\necho smoke > \"${TEST_UNDECLARED_OUTPUTS_DIR}/smoke.txt\"\n",
                  is_executable = True,
              )
              return [DefaultInfo(
                  executable = executable,
                  runfiles = ctx.runfiles(files = [executable]),
              )]

          native_wrapper_smoke_test = rule(
              implementation = _smoke_impl,
              test = True,
          )
          STARLARK

          cat > "${smoke_workspace}/BUILD.bazel" <<'STARLARK'
          load(":smoke.bzl", "native_wrapper_smoke_test")

          native_wrapper_smoke_test(name = "native_wrapper_smoke_test")
          STARLARK

          (
            cd "${smoke_workspace}"
            "${asset_path}" --batch --ignore_all_rc_files \
              "--output_base=${smoke_root}/output-base" test \
              --lockfile_mode=error \
              --spawn_strategy=local \
              --nocache_test_results \
              "--execution_log_json_file=${smoke_root}/execution.json" \
              --test_output=all \
              //:native_wrapper_smoke_test
          )

          python3 - "${smoke_root}/execution.json" <<'PYTHON'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as execution_log:
              content = execution_log.read()

          decoder = json.JSONDecoder()
          position = 0
          wrappers = []
          while position < len(content):
              while position < len(content) and content[position].isspace():
                  position += 1
              if position == len(content):
                  break

              action, position = decoder.raw_decode(content, position)
              if action.get("mnemonic") != "TestRunner":
                  continue

              arguments = action.get("commandArgs") or []
              if not arguments or os.path.basename(arguments[0]) != "tw":
                  continue

              inputs = action.get("inputs") or []
              if any(
                  os.path.basename(item.get("path", "")) == "test-setup.sh"
                  for item in inputs
              ):
                  raise SystemExit(
                      "Native TestRunner unexpectedly includes test-setup.sh"
                  )
              wrappers.append(arguments[0])

          if len(wrappers) != 1:
              raise SystemExit(
                  "Expected one executed native tw TestRunner; "
                  f"found {len(wrappers)}"
              )
          print(f"Verified native test wrapper: {wrappers[0]}")
          PYTHON

          smoke_log="${smoke_workspace}/bazel-testlogs/native_wrapper_smoke_test/test.log"
          grep -Fq 'native-wrapper-smoke-ok' "${smoke_log}"
          [[ "$(head -n 1 "${smoke_log}")" == 'exec ${PAGER:-/usr/bin/less} "$0" || exit 1' ]]

          smoke_manifest="${smoke_workspace}/bazel-testlogs/native_wrapper_smoke_test/test.outputs_manifest/MANIFEST"
          [[ "$(cat "${smoke_manifest}")" == $'smoke.txt\t6\ttext/plain' ]]

      - name: Upload Bazel artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazel-${{ needs.prepare.outputs.release_tag }}-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Download Bazel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bazel-*
          path: artifacts
          merge-multiple: true

      - name: Verify Bazel artifacts
        run: |
          set -euo pipefail
          for artifact_os in linux darwin; do
            for artifact_arch in x86_64 arm64; do
              asset_name="bazel-${RELEASE_TAG}-${artifact_os}-${artifact_arch}"
              test -f "artifacts/${asset_name}"
              test -f "artifacts/${asset_name}.sha256"
              (cd artifacts && sha256sum --check "${asset_name}.sha256")
            done
          done

      - name: Attest Bazel artifacts
        id: attest_bazel
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            artifacts/bazel-${{ needs.prepare.outputs.release_tag }}-linux-x86_64
            artifacts/bazel-${{ needs.prepare.outputs.release_tag }}-linux-arm64
            artifacts/bazel-${{ needs.prepare.outputs.release_tag }}-darwin-x86_64
            artifacts/bazel-${{ needs.prepare.outputs.release_tag }}-darwin-arm64

      - name: Write Bazel artifact attestations
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest_bazel.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "${ATTESTATION_BUNDLE}"
          for artifact_os in linux darwin; do
            for artifact_arch in x86_64 arm64; do
              asset_name="bazel-${RELEASE_TAG}-${artifact_os}-${artifact_arch}"
              jq --compact-output . "${ATTESTATION_BUNDLE}" \
                > "artifacts/${asset_name}.intoto.jsonl"
              test -s "artifacts/${asset_name}.intoto.jsonl"
            done
          done

      - name: Upload Bazel artifacts to GitHub release
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            existing_target=$(gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json targetCommitish \
              --jq .targetCommitish)
            if [[ "${existing_target}" != "${GITHUB_SHA}" ]]; then
              echo "Release ${RELEASE_TAG} already targets ${existing_target}, expected ${GITHUB_SHA}." >&2
              exit 1
            fi
            gh release upload "${RELEASE_TAG}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TAG}" \
              --notes "Bazel 9.3 binaries with native test wrappers for Linux and macOS. Download the platform-specific release artifact directly."
          fi
