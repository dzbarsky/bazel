name: Diagnose native Darwin BCR access

on:
  pull_request:
    branches:
      - codex/bazel-9.3-jvm-buildbuddy-release

permissions:
  contents: read

concurrency:
  group: bazel-native-network-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Diagnose native network
        run: python3 .github/scripts/native-network/diagnose.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-network-darwin-arm64
          path: native-network-results/**
          if-no-files-found: error
          retention-days: 7
