name: Validate date release patch port

on:
  push:
    branches: [codex/bazel-date-port-validation]

permissions:
  contents: read

jobs:
  validate:
    name: Validate RemoteTests and ServerTests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_REF: 57df9494fb1e9b6b24897bb988865cb3994ae0d1
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - name: Check out the date release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          path: source
          persist-credentials: false
      - name: Install Bazelisk and record source
        id: setup
        run: |
          set -euo pipefail
          [[ "${SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${SOURCE_REF}" ]]
          test "$(id -u)" -ne 0
          df -h . /tmp
          free -h
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            --output "${RUNNER_TEMP}/bazelisk" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          chmod +x "${RUNNER_TEMP}/bazelisk"
          printf 'Source: `%s`\n' "${SOURCE_REF}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Test module, toolchain, server, and repository cache regressions
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${BUILDBUDDY_API_KEY}" ]]; then
            echo 'Missing the BUILDBUDDY_API_KEY Actions secret.' >&2
            exit 1
          fi
          targets=(
            //src/test/java/com/google/devtools/build/lib/server:ServerTests
            //src/test/java/com/google/devtools/build/lib/remote:RemoteTests
          )
          printf 'Source: `%s`\n\n' "${SOURCE_REF}" >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- `%s`\n' "${targets[@]}" >> "${GITHUB_STEP_SUMMARY}"
          "${RUNNER_TEMP}/bazelisk" \
            --batch --nohome_rc --nosystem_rc --host_jvm_args=-Xmx4g \
            test --config=buildbuddy-cache \
            "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}" \
            --jobs=2 --local_test_jobs=1 \
            --local_resources=cpu=2 --local_resources=memory=8192 \
            --worker_max_instances=1 \
            --nocache_test_results --test_timeout=1800 --keep_going \
            --test_output=errors --test_summary=detailed --verbose_failures \
            --color=no --curses=no "${targets[@]}"

      - name: Upload test logs
        if: always() && steps.setup.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: date-port-test-logs-${{ github.run_id }}
          path: |
            source/bazel-testlogs/**/test.log
            source/bazel-testlogs/**/test.xml
          if-no-files-found: ignore
          retention-days: 7
