name: Validate corrections for PR106, PR109 and PR99

on:
  push:
    branches:
      - codex/bazel-pr106-111-validation
    paths:
      - '.github/workflows/validate-pr106-109-99-fixed.yml'

permissions:
  contents: read

jobs:
  validate:
    name: PR ${{ matrix.pr }} (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 106-release
            kind: files
            source: ed99dbf9b93c345b7505324ce0b5a6e159aaf7eb
          - pr: 99-release
            kind: attrs
            source: ed99dbf9b93c345b7505324ce0b5a6e159aaf7eb
          - pr: 106-upstream
            kind: files
            source: 30efa790aeb38904c06c4ca505b8e8dff8be8a98
          - pr: 109-upstream
            kind: remote
            source: 2f34c84d4ee709859b7a9af2f59a54d476deb3e6
          - pr: 99-upstream
            kind: attrs
            source: 4679b8ec91fed8e88c0eb86971443b6f9cf4dd07
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_REF: ${{ matrix.source }}
      VALIDATION_KIND: ${{ matrix.kind }}
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          path: source
          persist-credentials: false

      - name: Install build tools and record source
        id: setup
        run: |
          set -euo pipefail
          [[ "${SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${SOURCE_REF}" ]]
          test "$(id -u)" -ne 0
          df -h . /tmp
          free -h
          for tool in gcc g++ git java python3 unzip zip curl; do
            command -v "$tool"
          done
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            --output "${RUNNER_TEMP}/bazelisk" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          chmod +x "${RUNNER_TEMP}/bazelisk"
          mkdir -p "${RUNNER_TEMP}/validation"
          git log -1 --format=fuller > "${RUNNER_TEMP}/validation/source.txt"
          printf 'Source: `%s`\n\nTest selection: `%s`\n' \
            "${SOURCE_REF}" "${VALIDATION_KIND}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Run targeted tests without cached results
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${BUILDBUDDY_API_KEY}"
          case "${VALIDATION_KIND}" in
            files)
              targets=(
                //src/test/java/com/google/devtools/build/lib/skyframe:FilesystemValueCheckerTest
                //src/test/java/com/google/devtools/build/lib/unix:UnixTests
                //src/test/java/com/google/devtools/build/lib/vfs:VfsTests
              )
              ;;
            rules)
              targets=(//src/test/java/com/google/devtools/build/lib/rules:rules_tests)
              ;;
            repo)
              targets=(
                //src/test/java/com/google/devtools/build/lib/remote:RemoteTests
                //src/test/java/com/google/devtools/build/lib/bazel/repository:RepositoryTests
              )
              ;;
            remote)
              targets=(//src/test/java/com/google/devtools/build/lib/remote:RemoteTests)
              ;;
            cache)
              targets=(//src/test/py/bazel:remote_repo_contents_cache_test)
              ;;
            runtime)
              targets=(
                //src/test/java/com/google/devtools/build/lib/runtime:RuntimeTests
                //src/test/java/com/google/devtools/build/lib/vfs:VfsTests
              )
              ;;
            skyframe)
              targets=(//src/test/java/com/google/devtools/build/skyframe:SkyframeTests)
              ;;
            attrs)
              targets=(
                //src/test/java/com/google/devtools/build/lib/analysis/starlark:StarlarkAttrTransitionProviderTest
                //src/test/java/com/google/devtools/build/lib/analysis/starlark:StarlarkRuleTransitionProviderTest
                //src/test/java/com/google/devtools/build/lib/analysis/starlark:StarlarkTransitionCompositionTest
                //src/test/java/com/google/devtools/build/lib/analysis/starlark:StarlarkTransitionTest
                //src/test/java/com/google/devtools/build/lib/analysis/config:ExecutionTransitionFactoryTest
              )
              ;;
            *) exit 1 ;;
          esac
          printf '%s\n' "${targets[@]}" > "${RUNNER_TEMP}/validation/targets.txt"
          "${RUNNER_TEMP}/bazelisk" \
            --batch --nohome_rc --nosystem_rc --host_jvm_args=-Xmx4g \
            test \
            --jobs=2 --local_test_jobs=1 \
            --local_resources=cpu=2 --local_resources=memory=8192 \
            --worker_max_instances=1 \
            --remote_cache=grpcs://remote.buildbuddy.io --remote_upload_local_results --remote_download_toplevel --remote_timeout=600 \
            "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}" \
            --nocache_test_results --test_timeout=1800 --keep_going \
            --test_output=errors --test_summary=detailed --verbose_failures \
            --color=no --curses=no \
            "${targets[@]}"

      - name: Collect test logs
        if: always() && steps.setup.outcome == 'success'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tarfile
          results = Path(os.environ["RUNNER_TEMP"]) / "validation"
          logs = Path("bazel-testlogs")
          if logs.is_dir():
              with tarfile.open(results / "test-logs.tar.gz", "w:gz") as archive:
                  for root, _, files in os.walk(logs, followlinks=True):
                      for name in files:
                          if name in ("test.log", "test.xml"):
                              path = Path(root) / name
                              archive.add(path, arcname=str(path.relative_to(logs)))
          PY
          df -h . /tmp

      - name: Upload source record and test logs
        if: always() && steps.setup.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pr106-109-99-fixed-${{ matrix.pr }}-${{ matrix.kind }}-${{ github.run_id }}
          path: ${{ runner.temp }}/validation
          if-no-files-found: error
          retention-days: 14
