name: Check v48 Latin-1 USTAR extraction
on:
  push:
    branches:
      - codex/bazel-release49-validation
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Download and checksum published v48 Bazel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          gh release download 9.3.0-dzbarsky48 -R dzbarsky/bazel --pattern 'bazel-9.3.0-dzbarsky48-linux-x86_64' --pattern 'bazel-9.3.0-dzbarsky48-linux-x86_64.sha256'
          sha256sum --check bazel-9.3.0-dzbarsky48-linux-x86_64.sha256
          chmod +x bazel-9.3.0-dzbarsky48-linux-x86_64
          ./bazel-9.3.0-dzbarsky48-linux-x86_64 --batch version
      - name: Reproduce test_extract_ustar_tar_non_ascii_non_utf8_file_names
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/work"
          mkdir -p "${workdir}" "${RUNNER_TEMP}/archive"
          cd "${RUNNER_TEMP}/archive"
          mkdir "Ä_ustar_latin1_∅"
          echo "bar" > "$(echo -e 'Ä_ustar_latin1_∅/\xC4_foo_latin1_\xD6.txt')"
          tar --format=ustar -cvf ustar.tar "Ä_ustar_latin1_∅"
          cd "${workdir}"
          cat > MODULE.bazel <<'EOF'
          repo = use_repo_rule('//:test.bzl', 'repo')
          repo(name = 'foo')
          EOF
          touch BUILD
          cat > test.bzl <<EOF
          def _impl(repository_ctx):
            repository_ctx.extract('${RUNNER_TEMP}/archive/ustar.tar', 'out_dir', 'Ä_ustar_latin1_∅/')
            repository_ctx.file("BUILD", "filegroup(name='bar', srcs=[])")
          repo = repository_rule(implementation=_impl)
          EOF
          set +e
          "${RUNNER_TEMP}/bazel-9.3.0-dzbarsky48-linux-x86_64" \
            --batch --ignore_all_rc_files --output_base="${RUNNER_TEMP}/v48-ob" \
            build --color=no --curses=no @foo//:bar > "${RUNNER_TEMP}/baseline.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/baseline.log"
          printf 'v48 Latin-1 USTAR extraction exit status: %s\n' "${status}" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${status}" == 0 ]]; then
            grep -F bar "$(echo -e "${RUNNER_TEMP}/v48-ob/external/+repo+foo/out_dir/\xC4_foo_latin1_\xD6.txt")"
            echo "BASELINE_PASS"
          elif grep -Fq 'Error in extract: java.io.IOException: Error extracting' "${RUNNER_TEMP}/baseline.log" && grep -Fq '_foo_latin1_' "${RUNNER_TEMP}/baseline.log"; then
            echo "BASELINE_SAME_FAILURE"
          else
            echo "Unexpected baseline failure" >&2
            exit 1
          fi
